name: CPU scientific contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0'
          python -m pip install \
            'duckdb==1.5.5' \
            'ijson==3.5.1' \
            'numpy==2.2.6' \
            'pandas==2.3.3' \
            'polars==1.44.2' \
            'pyarrow==25.0.1' \
            'pytest==9.1.1' \
            'PyYAML==6.0.3' \
            'ruff==0.16.8'
          python -m pip install --no-deps -e .
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format
        run: ruff format --check src tests scripts
      - name: CPU-safe repository tests
        env:
          PYTHONPATH: src:.
        run: pytest -q --import-mode=importlib tests
      - name: Pure posthoc helper tests
        env:
          PYTHONPATH: src
        run: pytest -q scripts/posthoc/test_diagnostics.py
      - name: Public checkout integrity
        run: |
          test -z "$(git status --porcelain=v1)"
          git diff --check
