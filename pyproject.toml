[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mosaic-rec"
version = "0.1.0"
description = "Auditable multimodal sequential recommendation research"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "numpy>=2.0", "polars>=1.0", "pyarrow>=18.0", "torch>=2.6"]

[project.optional-dependencies]
data = ["gdown==6.4.0", "ijson==3.5.1", "py7zr==1.1.3"]
features = ["sentence-transformers==6.1.0"]
serving = ["fastapi==0.141.1", "uvicorn==0.53.0"]
dev = ["ruff==0.16.8", "pytest==9.1.1"]

[project.scripts]
mosaic-data-qa = "mosaic_rec.data_qa:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic_rec"]
